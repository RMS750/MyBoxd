services:
  - type: web
    name: myboxd
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: myboxd-db
          property: connectionString
      - key: TMDB_API_KEY
        sync: false
      - key: SESSION_DAYS
        value: "30"
      - key: MAX_UPLOAD_MB
        value: "25"

databases:
  - name: myboxd-db
    databaseName: myboxd
    user: myboxd
    plan: free
